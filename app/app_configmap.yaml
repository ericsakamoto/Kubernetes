apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
data:
  config.yaml: |
    extensions:
      basicauth/client:
        client_auth:
          username: !!str ${env:GRAFANA_INSTANCE_ID}
          password: "${env:GRAFANA_API_KEY}"

    receivers:
      otlp:
        protocols:
          http:  # listens on 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      otlphttp/grafana:
        endpoint: https://otlp-gateway-prod-sa-east-1.grafana.net/otlp
        auth:
          authenticator: basicauth/client
        # optionally tune timeouts and retries
        timeout: 10s
        retry_on_failure:
          enabled: true

    service:
      extensions: [basicauth/client]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/grafana]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/grafana]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/grafana]